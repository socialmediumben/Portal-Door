<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Door</title>
    <link rel="stylesheet" href="static/style.css">
    
    <!-- Preload transition videos from static folder -->
    <link rel="preload" href="static/videos/Door Close.webm" as="video" type="video/webm" crossorigin>
    <link rel="preload" href="static/videos/Door Open.webm" as="video" type="video/webm" crossorigin>
</head>
<body>
    <div class="controls">
        <input type="text" id="contentIdInput" placeholder="Enter Content ID" autocomplete="off">
        <button id="fetchMediaBtn">Show Media</button>
    </div>

    <div class="media-container">
        <h2 id="mediaTitle"></h2>
        <div id="mediaDisplay"></div>
    </div>

    <video id="transitionVideo" class="transition-overlay" muted playsinline preload="auto"></video>

    <script src="static/script.js"></script>
</body>
</html>
