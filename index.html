<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Door</title>
    <link rel="stylesheet" href="static/style.css?v=4.1">
    <!-- Google MediaPipe for AI background removal -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="controls">
        <div class="dev-mode-bar">
            <span class="dev-title"><span class="dev-indicator"></span> DEVELOPER MODE</span>
            <div class="dev-bar-actions">
                <button id="photoboothToggleBtn" class="dev-photobooth-btn" title="Toggle Photobooth Mode (*)">📸 Photo: OFF</button>
                <button id="soundToggleBtn" class="dev-sound-btn" title="Toggle audio on/off (.)">🔊 Sound: ON</button>
                <span class="version-badge">v4.1</span>
            </div>
        </div>
        <div class="controls-header">
            <input type="text" id="contentIdInput" placeholder="Enter Content ID or scan NFC..." autocomplete="off">
            <button id="fetchMediaBtn">Show Media</button>
        </div>
        <div class="hotkeys-guide">
            <div class="hotkeys-row">
                <span class="hotkeys-tag tag-portal">PORTAL</span>
                <div class="hotkey-item"><kbd>Tab</kbd><span>Dev Mode</span></div>
                <div class="hotkey-item"><kbd>Esc</kbd><span>Home</span></div>
                <div class="hotkey-item"><kbd>.</kbd><span>Sound</span></div>
                <div class="hotkey-item"><kbd>*</kbd><span>Photo</span></div>
                <div class="hotkey-item"><kbd>(</kbd><span>Fullscreen</span></div>
                <div class="hotkey-item"><kbd>)</kbd><span>Reload</span></div>
                <div class="hotkey-item"><kbd>Enter</kbd><span>Trigger</span></div>
            </div>
            <div class="hotkeys-row keypad-row">
                <span class="hotkeys-tag tag-keypad">KEYPAD</span>
                <div class="hotkey-item"><kbd>FN + 5</kbd><span>Light Mode</span></div>
                <div class="hotkey-item"><kbd>FN + 4/6</kbd><span>Light Speed</span></div>
                <div class="hotkey-item"><kbd>FN + +/Enter</kbd><span>Brightness</span></div>
                <div class="hotkey-item"><kbd>FN + Esc</kbd><span>Calculator</span></div>
            </div>
        </div>

        <div class="dev-dataset-container">
            <div class="dev-dataset-header">
                <span id="devDatasetTitle">Developer Dataset (Full):</span>
                <span class="dev-dataset-subtext">Click any row to test</span>
            </div>
            <div id="devDatasetList" class="dev-dataset-list">
                <div class="dev-dataset-empty">Loading Google Sheet data...</div>
            </div>
        </div>
    </div>

    <!-- On-screen feedback toast for audio / photobooth toggle -->
    <div id="soundToast" class="sound-toast"></div>

    <div class="media-container">
        <h2 id="mediaTitle"></h2>
        <div id="mediaDisplay"></div>
        <canvas id="photoboothCanvas"></canvas>
    </div>

    <!-- Hidden video element for raw webcam capture -->
    <video id="webcamVideo" playsinline muted style="display: none;"></video>

    <video id="transitionVideo" class="transition-overlay" muted playsinline preload="auto"></video>

    <script src="static/script.js?v=4.1"></script>
</body>
</html>
