<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Door</title>
    <link rel="stylesheet" href="static/style.css?v=2.2">
</head>
<body>
    <div class="controls">
        <div class="controls-header">
            <span class="version-badge">v2.2</span>
            <input type="text" id="contentIdInput" placeholder="Enter Content ID or scan card..." autocomplete="off">
            <button id="fetchMediaBtn">Show Media</button>
        </div>
        <div class="hotkeys-guide">
            <div class="hotkey-item"><kbd>Tab</kbd><span>Menu</span></div>
            <div class="hotkey-item"><kbd>(</kbd><span>Fullscreen</span></div>
            <div class="hotkey-item"><kbd>)</kbd><span>Reload Sheets</span></div>
            <div class="hotkey-item"><kbd>Enter</kbd><span>Trigger ID</span></div>
        </div>
    </div>

    <div class="media-container">
        <h2 id="mediaTitle"></h2>
        <div id="mediaDisplay"></div>
    </div>

    <video id="transitionVideo" class="transition-overlay" muted playsinline preload="auto"></video>

    <script src="static/script.js?v=2.2"></script>
</body>
</html>
